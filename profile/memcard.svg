<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400">
  <foreignObject x="0" y="0" width="360" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="stage">
      <style>
        :root, .stage {
          --psx-grey: #a0a4a8;
          --psx-dark-grey: #83878b;
          --psx-light-grey: #b5b9bd;
          --psx-text: #2f3235;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .stage {
          width: 360px;
          height: 400px;
          background-color: #121417;
          border-radius: 16px;
          display: flex;
          justify-content: center;
          align-items: center;
          perspective: 1000px;
          overflow: hidden;
          font-family: Arial, Helvetica, sans-serif;
        }

        .scene { width: 200px; height: 280px; position: relative; transform-style: preserve-3d; }

        .memory-card {
          width: 100%;
          height: 100%;
          position: absolute;
          transform-style: preserve-3d;
          animation: rotateCard 12s linear infinite;
        }

        @keyframes rotateCard {
          0%   { transform: rotateX(20deg) rotateY(0deg); }
          100% { transform: rotateX(20deg) rotateY(360deg); }
        }

        .face {
          position: absolute;
          background: var(--psx-grey);
          border-radius: 10px;
          box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .face.front, .face.back { width: 200px; height: 280px; }
        .face.left, .face.right { width: 24px; height: 280px; left: 88px; }
        .face.top, .face.bottom { width: 200px; height: 24px; top: 128px; }

        .face.front  { transform: translateZ(12px); }
        .face.back   { transform: rotateY(180deg) translateZ(12px); }
        .face.left   { transform: rotateY(-90deg) translateZ(100px); }
        .face.right  { transform: rotateY(90deg) translateZ(100px); }
        .face.top    { transform: rotateX(90deg) translateZ(140px); }
        .face.bottom { transform: rotateX(-90deg) translateZ(140px); }

        .face.front {
          background: linear-gradient(145deg, var(--psx-light-grey) 0%, var(--psx-grey) 50%, var(--psx-dark-grey) 100%);
          padding: 12px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
        }

        .screw-recess {
          position: absolute;
          top: 10px;
          width: 12px;
          height: 12px;
          background: var(--psx-dark-grey);
          border-radius: 50%;
          box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6), 1px 1px 0 rgba(255,255,255,0.3);
        }
        .screw-recess.left  { left: 12px; }
        .screw-recess.right { right: 12px; }

        .arrow-icon {
          margin-top: 6px;
          width: 0;
          height: 0;
          border-left: 14px solid transparent;
          border-right: 14px solid transparent;
          border-bottom: 12px solid var(--psx-dark-grey);
          filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.4));
          position: relative;
        }
        .arrow-icon::after {
          content: '';
          position: absolute;
          top: 3px;
          left: -10px;
          width: 0;
          height: 0;
          border-left: 10px solid transparent;
          border-right: 10px solid transparent;
          border-bottom: 9px solid var(--psx-grey);
        }

        .brand-section { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }

        .top-icon {
          font-weight: 900;
          font-size: 22px;
          color: var(--psx-text);
          line-height: 1;
          letter-spacing: -2px;
          text-shadow: 1px 1px 0 rgba(255,255,255,0.2);
        }
        .brand-title { font-size: 11px; font-weight: 700; color: var(--psx-text); letter-spacing: 0.5px; margin-top: 2px; }
        .brand-subtitle { font-size: 13px; font-weight: 900; color: var(--psx-text); letter-spacing: 2px; margin-top: 4px; }

        .label-recess {
          width: 170px;
          height: 110px;
          background: var(--psx-grey);
          border-radius: 6px;
          box-shadow: inset 2px 2px 5px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(255,255,255,0.4);
          margin-top: 4px;
        }

        .brand-embossed {
          font-size: 16px;
          font-weight: 900;
          letter-spacing: 4px;
          color: var(--psx-grey);
          text-shadow: -1px -1px 1px rgba(0,0,0,0.5), 1px 1px 1px rgba(255,255,255,0.6);
          margin-bottom: 8px;
        }

        .face.left, .face.right {
          background: repeating-linear-gradient(180deg,
            var(--psx-grey) 0px, var(--psx-grey) 12px,
            var(--psx-dark-grey) 12px, var(--psx-dark-grey) 18px);
        }

        .face.bottom { background: #2a2c2e; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .pin-slot { width: 14px; height: 10px; background: #111; border-bottom: 2px solid #d4af37; }
      </style>

      <div class="scene">
        <div class="memory-card">
          <div class="face front">
            <div class="screw-recess left"></div>
            <div class="screw-recess right"></div>
            <div class="arrow-icon"></div>
            <div class="brand-section">
              <div class="top-icon">git</div>
              <div class="brand-title">https://github.com/FUHM550</div>
              <div class="brand-subtitle">FUHM550</div>
            </div>
            <div class="label-recess"></div>
            <div class="brand-embossed">github</div>
          </div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face right"></div>
          <div class="face top"></div>
          <div class="face bottom">
            <div class="pin-slot"></div><div class="pin-slot"></div>
            <div class="pin-slot"></div><div class="pin-slot"></div>
            <div class="pin-slot"></div><div class="pin-slot"></div>
            <div class="pin-slot"></div><div class="pin-slot"></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
