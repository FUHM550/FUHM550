<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS1 Memory Card in Pure CSS</title>
  <style>
    :root {
      --psx-grey: #a0a4a8;
      --psx-dark-grey: #83878b;
      --psx-light-grey: #b5b9bd;
      --psx-text: #2f3235;
      --psx-shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121417;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      perspective: 1000px;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    /* Scene Setup */
    .scene {
      width: 200px;
      height: 280px;
      position: relative;
    }

    /* Card Container with Auto-Rotation & Hover Pause */
    .memory-card {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateX(25deg) rotateY(-30deg);
      animation: rotateCard 12s linear infinite;
      cursor: grab;
    }

    .memory-card:hover {
      animation-play-state: paused;
    }

    @keyframes rotateCard {
      0% { transform: rotateX(20deg) rotateY(0deg); }
      100% { transform: rotateX(20deg) rotateY(360deg); }
    }

    /* Common Face Properties */
    .face {
      position: absolute;
      background: var(--psx-grey);
      border-radius: 10px;
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.2);
    }

    /* Front & Back Planes */
    .front, .back {
      width: 200px;
      height: 280px;
    }

    /* Thickness Profiles */
    .left, .right {
      width: 24px;
      height: 280px;
      left: 88px;
    }

    .top, .bottom {
      width: 200px;
      height: 24px;
      top: 128px;
    }

    /* 3D Depth Offsets */
    .front  { transform: translateZ(12px); }
    .back   { transform: rotateY(180deg) translateZ(12px); }
    .left   { transform: rotateY(-90deg) translateZ(100px); }
    .right  { transform: rotateY(90deg) translateZ(100px); }
    .top    { transform: rotateX(90deg) translateZ(140px); }
    .bottom { transform: rotateX(-90deg) translateZ(140px); }

    /* FRONT FACE IMPLEMENTATION */
    .front {
      background: linear-gradient(145deg, var(--psx-light-grey) 0%, var(--psx-grey) 50%, var(--psx-dark-grey) 100%);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Top Corner Screw Recesses */
    .screw-recess {
      position: absolute;
      top: 10px;
      width: 12px;
      height: 12px;
      background: var(--psx-dark-grey);
      border-radius: 50%;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6), 1px 1px 0 rgba(255,255,255,0.3);
    }
    .screw-recess.left { left: 12px; }
    .screw-recess.right { right: 12px; }

    /* Embossed Top Insertion Arrow */
    .arrow-icon {
      margin-top: 6px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 12px solid var(--psx-dark-grey);
      filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.4));
      position: relative;
    }

    .arrow-icon::after {
      content: '';
      position: absolute;
      top: 3px;
      left: -10px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 9px solid var(--psx-grey);
    }

    /* PlayStation Header Branding */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
    }

    /* Stylized PS Logo */
    .top-icon {
      font-weight: 900;
      font-size: 22px;
      color: var(--psx-text);
      line-height: 1;
      letter-spacing: -2px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.2);
    }

    .brand-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--psx-text);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 900;
      color: var(--psx-text);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Recessed Blank Label Tray */
    .label-recess {
      width: 170px;
      height: 110px;
      background: var(--psx-grey);
      border-radius: 6px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(255,255,255,0.4);
      margin-top: 4px;
    }

    /* Embossed tex bottom Text */
    .brand-embossed {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--psx-grey);
      text-shadow: 
        -1px -1px 1px rgba(0,0,0,0.5), 
         1px  1px 1px rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }

    /* Side Scalloped Grips */
    .left, .right {
      background: repeating-linear-gradient(
        180deg,
        var(--psx-grey) 0px,
        var(--psx-grey) 12px,
        var(--psx-dark-grey) 12px,
        var(--psx-dark-grey) 18px
      );
    }

    /* Bottom Connection Bay */
    .bottom {
      background: #2a2c2e;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .pin-slot {
      width: 14px;
      height: 10px;
      background: #111;
      border-bottom: 2px solid #d4af37;
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="memory-card">
      
      <!-- Front Face -->
      <div class="face front">
        <div class="screw-recess left"></div>
        <div class="screw-recess right"></div>
        
        <div class="arrow-icon"></div>

        <div class="brand-section">
          <div class="top-icon">git</div>
          <div class="brand-title">https://github.com/FUHM550</div>
          <div class="brand-subtitle"> FUHM550 </div>
        </div>

        <div class="label-recess"></div>

        <div class="brand-embossed">github</div>
      </div>

      <!-- Back Face -->
      <div class="face back"></div>

      <!-- Sides with Ribbed Scallop Grips -->
      <div class="face left"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      
      <!-- Bottom Connector Pins Interface -->
      <div class="face bottom">
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
        <div class="pin-slot"></div>
      </div>

    </div>
  </div>

</body>
</html>
